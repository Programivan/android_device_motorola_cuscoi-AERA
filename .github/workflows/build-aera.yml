name: Build AERA Recovery for Motorola Edge 50 Fusion (cuscoi)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'recoveryimage'
        type: choice
        options:
          - 'recoveryimage'
          - 'bootimage'

jobs:
  build:
    name: Build AERA Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Clean and Maximize Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h

          # Remove heavy pre-installed toolchains and SDKs not needed for recovery
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /var/lib/docker
          sudo docker image prune --all --force || true
          sudo apt-get clean || true

          # Create additional 6GB swapfile (adding to runner's default swap -> 10GB total swap)
          sudo fallocate -l 6G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=6144
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra

          echo "=== Disk space and memory after setup ==="
          df -h
          free -h

      - name: Checkout Cuscoi Device Tree
        uses: actions/checkout@v4
        with:
          path: cuscoi_tree

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig \
            libncurses5 python3 rsync curl git lz4 zstd ccache bc libssl-dev

          # Install repo tool
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

          git config --global user.name "AERA Builder"
          git config --global user.email "builder@aera-recovery.org"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Initialize and Sync AERA Recovery
        run: |
          mkdir -p $GITHUB_WORKSPACE/aera_recovery
          cd $GITHUB_WORKSPACE/aera_recovery

          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1
          sed -i 's|ssh://git@github.com/|https://github.com/|g' .repo/manifests/*.xml 2>/dev/null || true
          repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)

          # Delete .repo directory to reclaim ~20 GB of disk space before compilation
          rm -rf .repo
          echo "=== Disk space after sync and .repo removal ==="
          df -h

      - name: Integrate Cuscoi Device Tree
        run: |
          mkdir -p $GITHUB_WORKSPACE/aera_recovery/device/motorola/cuscoi
          cp -r $GITHUB_WORKSPACE/cuscoi_tree/* $GITHUB_WORKSPACE/aera_recovery/device/motorola/cuscoi/

      - name: Build AERA Recovery
        run: |
          cd $GITHUB_WORKSPACE/aera_recovery
          export ALLOW_MISSING_DEPENDENCIES=true
          export GOMEMLIMIT=6GiB
          export MALLOC_ARENA_MAX=2
          source build/envsetup.sh
          lunch twrp_cuscoi-bp2a-eng
          mka adbd ${{ inputs.build_target || 'recoveryimage' }} -j$(nproc) || m adbd ${{ inputs.build_target || 'recoveryimage' }} -j$(nproc)

      - name: Package Output Artifacts
        run: |
          cd $GITHUB_WORKSPACE/aera_recovery/out/target/product/cuscoi
          mkdir -p $GITHUB_WORKSPACE/output
          cp -f recovery.img $GITHUB_WORKSPACE/output/AERA-R1.0-cuscoi-recovery.img 2>/dev/null || true
          cp -f boot.img $GITHUB_WORKSPACE/output/AERA-R1.0-cuscoi-boot.img 2>/dev/null || true

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-cuscoi
          path: output/*
